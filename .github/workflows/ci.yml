name: CI

on:
  push:
    paths:
      - 'scripts/**'
      - '.chezmoi.toml.tmpl'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - '.chezmoi.toml.tmpl'
      - '.github/workflows/ci.yml'
      - 'README.md'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish age curl jq
          mkdir -p "$HOME/.local/bin"
          # Install chezmoi
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          # Install sops
          SOPS_VERSION=3.8.1
          curl -LO "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          mv "sops-v${SOPS_VERSION}.linux.amd64" "$HOME/.local/bin/sops"
          chmod +x "$HOME/.local/bin/sops"
          # Ubuntu's package can lag behind the directives used by this repo.
          SHELLCHECK_VERSION=0.11.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C /tmp
          mv "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$HOME/.local/bin/shellcheck"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup environment and age key
        shell: bash
        run: |
          mkdir -p "$HOME/.config/chezmoi"
          # Generate a new age key for CI
          age-keygen -o "$HOME/.config/chezmoi/key.txt"
          # Extract public key and save to GITHUB_ENV
          PUBKEY=$(grep "public key:" "$HOME/.config/chezmoi/key.txt" | cut -d: -f2 | xargs)
          echo "CI_PUBKEY=$PUBKEY" >> "$GITHUB_ENV"

      - name: Initialize chezmoi
        shell: bash
        run: |
          set -euo pipefail
          # Generate config for this checkout
          chezmoi init --source .
          # Point chezmoi's default source path at the checked out repository so hooks resolve correctly
          mkdir -p "$HOME/.local/share"
          rm -rf "$HOME/.local/share/chezmoi"
          ln -s "$PWD" "$HOME/.local/share/chezmoi"
          # Ensure the generated config uses the CI age key and recipient
          sed -i "s/recipient = \".*\"/recipient = \"$CI_PUBKEY\"/" "$HOME/.config/chezmoi/chezmoi.toml"
          # Verify sops can use the key (sanity check)
          export SOPS_AGE_KEY_FILE="$HOME/.config/chezmoi/key.txt"
          echo "test: value" > test_sops.yaml
          sops --encrypt --age "$CI_PUBKEY" test_sops.yaml > test_sops.enc.yaml
          sops --decrypt test_sops.enc.yaml | grep -q "test: value"
          test "$(chezmoi source-path)" = "$HOME/.local/share/chezmoi"

      - name: Test secret add hook
        shell: bash
        run: |
          cd "$HOME"
          bash "$GITHUB_WORKSPACE/scripts/test_check-secrets.sh"

      - name: Test removed-file update hook
        shell: bash
        run: |
          cd "$HOME"
          bash "$GITHUB_WORKSPACE/scripts/test_check-removed-files.sh"

      - name: Test secret rendering
        shell: bash
        run: |
          cd "$HOME"
          bash "$GITHUB_WORKSPACE/scripts/test_apply-secrets.sh"

      - name: Test reusable secret scanner
        shell: bash
        run: |
          cd "$HOME"
          bash "$GITHUB_WORKSPACE/scripts/test_scan-secrets.sh"

      - name: Run ShellCheck
        shell: bash
        run: shellcheck "$GITHUB_WORKSPACE"/scripts/*.sh

  test-macos:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v5

      - name: Install macOS dependencies
        shell: bash
        run: |
          brew install bash chezmoi sops age jq shellcheck
          BREW_PREFIX=$(brew --prefix)
          echo "$BREW_PREFIX/bin" >> "$GITHUB_PATH"
          echo "BREW_BASH=$BREW_PREFIX/bin/bash" >> "$GITHUB_ENV"

      - name: Verify modern Bash
        shell: bash
        run: |
          "$BREW_BASH" --version
          "$BREW_BASH" -c '(( BASH_VERSINFO[0] >= 4 ))'
          test "$(command -v bash)" = "$BREW_BASH"

      - name: Setup macOS environment and age key
        shell: bash
        run: |
          mkdir -p "$HOME/.config/chezmoi"
          age-keygen -o "$HOME/.config/chezmoi/key.txt"
          PUBKEY=$(grep "public key:" "$HOME/.config/chezmoi/key.txt" | cut -d: -f2 | xargs)
          echo "CI_PUBKEY=$PUBKEY" >> "$GITHUB_ENV"

      - name: Initialize chezmoi on macOS
        shell: bash
        run: |
          set -euo pipefail
          chezmoi init --source .
          mkdir -p "$HOME/.local/share"
          rm -rf "$HOME/.local/share/chezmoi"
          ln -s "$PWD" "$HOME/.local/share/chezmoi"
          sed -i '' "s/recipient = \".*\"/recipient = \"$CI_PUBKEY\"/" "$HOME/.config/chezmoi/chezmoi.toml"
          export SOPS_AGE_KEY_FILE="$HOME/.config/chezmoi/key.txt"
          echo "test: value" > test_sops.yaml
          sops --encrypt --age "$CI_PUBKEY" test_sops.yaml > test_sops.enc.yaml
          sops --decrypt test_sops.enc.yaml | grep -q "test: value"
          test "$(chezmoi source-path)" = "$HOME/.local/share/chezmoi"

      - name: Test secret add hook on macOS
        shell: bash
        run: |
          cd "$HOME"
          log="$RUNNER_TEMP/test-check-secrets.log"
          set +e
          "$BREW_BASH" -x "$GITHUB_WORKSPACE/scripts/test_check-secrets.sh" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            details=$(grep -E '❌|failed|failure|error:|not found|illegal option|command not found' "$log" | tail -n 30 || true)
            if [[ -z $details ]]; then
              details=$(tail -n 40 "$log")
            fi
            details=${details//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            details=${details//$'\n'/'%0A'}
            printf '::error file=scripts/test_check-secrets.sh,title=macOS secret-hook test failed::%s\n' "$details"
            exit "$status"
          fi

      - name: Test removed-file update hook on macOS
        shell: bash
        run: |
          cd "$HOME"
          log="$RUNNER_TEMP/test-check-removed-files.log"
          set +e
          "$BREW_BASH" -x "$GITHUB_WORKSPACE/scripts/test_check-removed-files.sh" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            details=$(grep -E 'check-removed-files:|❌' "$log" | tail -n 12 || true)
            tail_lines=$(tail -n 6 "$log" | cut -c1-300)
            details="${details}"$'\n'"${tail_lines}"
            details=${details//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            details=${details//$'\n'/'%0A'}
            printf '::error file=scripts/test_check-removed-files.sh,title=macOS removed-file test failed::%s\n' "$details"
            exit "$status"
          fi

      - name: Test secret rendering on macOS
        shell: bash
        run: |
          cd "$HOME"
          "$BREW_BASH" "$GITHUB_WORKSPACE/scripts/test_apply-secrets.sh"

      - name: Test reusable secret scanner on macOS
        shell: bash
        run: |
          cd "$HOME"
          "$BREW_BASH" "$GITHUB_WORKSPACE/scripts/test_scan-secrets.sh"

      - name: Run ShellCheck on macOS
        shell: bash
        run: shellcheck "$GITHUB_WORKSPACE"/scripts/*.sh
