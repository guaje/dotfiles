name: CI

# The ubuntu half of the host-independent test matrix: the chezmoi hooks, the secret
# tooling, and rendering. Platform components keep their own files: macOS in
# macos-tests.yml, the Termux shortcut in termux-tests.yml, Pi in pi-tests.yml.

on:
  push:
    paths:
      - 'scripts/**'
      - '.chezmoi.toml.tmpl'
      - '.chezmoiignore'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - '.chezmoi.toml.tmpl'
      - '.chezmoiignore'
      - '.github/workflows/ci.yml'
      - 'README.md'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          # expect: without it test_check-removed-files.sh skips its real PTY prompt
          # contract, which the macOS runner and Termux both execute.
          sudo apt-get install -y zsh fish age curl jq expect
          mkdir -p "$HOME/.local/bin"
          # Install chezmoi
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          # Install sops
          SOPS_VERSION=3.8.1
          curl -LO "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          mv "sops-v${SOPS_VERSION}.linux.amd64" "$HOME/.local/bin/sops"
          chmod +x "$HOME/.local/bin/sops"
          # Ubuntu's package can lag behind the directives used by this repo.
          SHELLCHECK_VERSION=0.11.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C /tmp
          mv "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$HOME/.local/bin/shellcheck"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup environment and age key
        shell: bash
        run: |
          mkdir -p "$HOME/.config/chezmoi"
          # Generate a new age key for CI
          age-keygen -o "$HOME/.config/chezmoi/key.txt"
          # Extract public key and save to GITHUB_ENV
          PUBKEY=$(grep "public key:" "$HOME/.config/chezmoi/key.txt" | cut -d: -f2 | xargs)
          echo "CI_PUBKEY=$PUBKEY" >> "$GITHUB_ENV"

      - name: Initialize chezmoi
        shell: bash
        run: |
          set -euo pipefail
          # Generate config for this checkout
          chezmoi init --source .
          # Point chezmoi's default source path at the checked out repository so hooks resolve correctly
          mkdir -p "$HOME/.local/share"
          rm -rf "$HOME/.local/share/chezmoi"
          ln -s "$PWD" "$HOME/.local/share/chezmoi"
          # Ensure the generated config uses the CI age key and recipient
          sed -i "s/recipient = \".*\"/recipient = \"$CI_PUBKEY\"/" "$HOME/.config/chezmoi/chezmoi.toml"
          # Verify sops can use the key (sanity check)
          export SOPS_AGE_KEY_FILE="$HOME/.config/chezmoi/key.txt"
          echo "test: value" > test_sops.yaml
          sops --encrypt --age "$CI_PUBKEY" test_sops.yaml > test_sops.enc.yaml
          sops --decrypt test_sops.enc.yaml | grep -q "test: value"
          test "$(chezmoi source-path)" = "$HOME/.local/share/chezmoi"

      - name: Test secret add hook
        shell: bash
        run: |
          cd "$HOME"
          bash "$GITHUB_WORKSPACE/scripts/test_check-secrets.sh"

      - name: Test removed-file update hook
        shell: bash
        run: |
          cd "$HOME"
          bash "$GITHUB_WORKSPACE/scripts/test_check-removed-files.sh"

      - name: Test bootstrap hook
        shell: bash
        run: |
          cd "$HOME"
          bash "$GITHUB_WORKSPACE/scripts/test_bootstrap.sh"

      - name: Test secret rendering
        shell: bash
        run: |
          cd "$HOME"
          bash "$GITHUB_WORKSPACE/scripts/test_apply-secrets.sh"

      - name: Test reusable secret scanner
        shell: bash
        run: |
          cd "$HOME"
          bash "$GITHUB_WORKSPACE/scripts/test_scan-secrets.sh"

      - name: Run ShellCheck
        shell: bash
        run: |
          shellcheck "$GITHUB_WORKSPACE"/scripts/*.sh
