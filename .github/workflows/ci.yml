name: CI

# Orchestrator. No tests live here: each platform's suite is a reusable workflow in this
# directory, called below, and "required-check" at the bottom is the one status to make
# branch-protection required. That split buys three things — a suite can only go red on a
# host that actually runs it, one check gates a branch instead of four, and concurrency is
# decided once for the whole fan-out.
#
# Path filters belong to the caller: GitHub ignores "on:" in a workflow reached through
# workflow_call, so a leaf cannot filter itself. Consequence worth knowing: anything
# matching the union below schedules all four suites, so these filters are what they
# collectively read. If macOS minutes get expensive, the fix is a changed-paths job here
# passing an output into the macos call's "if:", not moving filters back into the leaf.
#
# Do not convert this to "on: workflow_run": that fires only after another workflow has
# already finished, runs against a default-branch checkout, and cannot see the called
# jobs' results without passing artifacts around — none of which is what a fan-out needs.

on:
  push:
    paths:
      - 'scripts/**'
      - '.chezmoi.toml.tmpl'
      - '.chezmoiignore'
      - '.chezmoitemplates/**'
      - 'dot_bashrc.tmpl'
      - 'dot_zshrc.tmpl'
      - 'dot_config/**'
      - 'dot_local/**'
      - 'dot_termux/**'
      - 'private_dot_*/**'
      - 'secrets/**'
      - '.github/workflows/**'
      - 'README.md'
  pull_request:
    paths:
      - 'scripts/**'
      - '.chezmoi.toml.tmpl'
      - '.chezmoiignore'
      - '.chezmoitemplates/**'
      - 'dot_bashrc.tmpl'
      - 'dot_zshrc.tmpl'
      - 'dot_config/**'
      - 'dot_local/**'
      - 'dot_termux/**'
      - 'private_dot_*/**'
      - 'secrets/**'
      - '.github/workflows/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Named with the event so dispatching a leaf by hand cannot cancel the push run that
  # is already testing the same commit.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # A push to main is the run that produces the result for the published commit, and
  # jobs still queued count as in progress: cancelling them leaves the tip with no
  # macOS suite at all. Only branches and PRs get superseded.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux:
    name: Linux
    uses: ./.github/workflows/linux-tests.yml

  macos:
    name: macOS
    uses: ./.github/workflows/macos-tests.yml

  termux:
    name: Termux
    uses: ./.github/workflows/termux-tests.yml

  pi:
    name: Pi
    uses: ./.github/workflows/pi-tests.yml

  required-check:
    # if: always() matters: without it GitHub skips this job when any suite fails, and
    # a skipped check never satisfies a required status, so a red suite would look like
    # a pending or missing check instead of a failure.
    name: All suites
    needs: [linux, macos, termux, pi]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Aggregate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          set -uo pipefail
          printf 'needs results: %s\n' "$RESULTS"
          printf '%s' "$RESULTS" | grep -Eq '"(failure|cancelled|skipped)"' && {
            echo '::error::a platform job reported a non-success result'
            exit 1
          }
          # needs.*.result is not sufficient by itself: it read "success" for the macOS job
          # while the job inside that reusable workflow sat queued and was cancelled, so this
          # gate passed a run whose macOS suite never executed a step. The run's own job
          # records are the authority. Every one must have succeeded, and every platform must
          # appear, because an empty list would satisfy "all succeeded" vacuously.
          rows=$(gh api "repos/{owner}/{repo}/actions/runs/$RUN_ID/jobs" --paginate \
                   --jq '.jobs[] | select(.name != "All suites") | "\(.conclusion)\t\(.name)"')
          if [ -z "$rows" ]; then
            echo '::error::no job records visible; refusing to pass on an empty list'
            exit 1
          fi
          bad=0
          while IFS=$'\t' read -r concl name; do
            printf '  %-46s %s\n' "$name" "$concl"
            [ "$concl" = success ] || bad=1
          done <<< "$rows"
          for p in Linux macOS Termux Pi; do
            printf '%s\n' "$rows" | awk -F'\t' -v p="$p / " 'index($2, p) == 1 { found = 1 } END { exit !found }' || {
              echo "::error::$p suite left no job record at all"
              bad=1
            }
          done
          [ "$bad" = 0 ] || { echo '::error::at least one job did not succeed'; exit 1; }
          echo 'all platform suites passed'
