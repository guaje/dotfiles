name: Linux tests

# Everything that is either Linux-specific or host-independent: the chezmoi hooks, the
# secret tooling, rendering, and the Herdr script suite. Called from ci.yml, which owns
# the path filters — a workflow reached through workflow_call never evaluates its own
# "on:" section, so triggering belongs to the caller only. workflow_dispatch stays here
# for the days you want to run just this file by hand.
#
# The Herdr suite runs twice, deliberately: once with every shell installed, and once
# with zsh removed. A developer's Mac has both, so without the second job a whole
# platform's coverage (Termux, where bash is the default and often the only shell) can
# vanish as skipped lines nobody reads. Both jobs assert on the suite's machine-readable
# "summary" line, and the bash-only one additionally requires skipped > 0: if zsh stops
# being absent, that job has stopped testing anything and must say so.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chezmoi-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish age curl jq
          mkdir -p "$HOME/.local/bin"
          # Install chezmoi
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          # Install sops
          SOPS_VERSION=3.8.1
          curl -LO "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          mv "sops-v${SOPS_VERSION}.linux.amd64" "$HOME/.local/bin/sops"
          chmod +x "$HOME/.local/bin/sops"
          # Ubuntu's package can lag behind the directives used by this repo.
          SHELLCHECK_VERSION=0.11.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C /tmp
          mv "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$HOME/.local/bin/shellcheck"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup environment and age key
        shell: bash
        run: |
          mkdir -p "$HOME/.config/chezmoi"
          # Generate a new age key for CI
          age-keygen -o "$HOME/.config/chezmoi/key.txt"
          # Extract public key and save to GITHUB_ENV
          PUBKEY=$(grep "public key:" "$HOME/.config/chezmoi/key.txt" | cut -d: -f2 | xargs)
          echo "CI_PUBKEY=$PUBKEY" >> "$GITHUB_ENV"

      - name: Initialize chezmoi
        shell: bash
        run: |
          set -euo pipefail
          # Generate config for this checkout
          chezmoi init --source .
          # Point chezmoi's default source path at the checked out repository so hooks resolve correctly
          mkdir -p "$HOME/.local/share"
          rm -rf "$HOME/.local/share/chezmoi"
          ln -s "$PWD" "$HOME/.local/share/chezmoi"
          # Ensure the generated config uses the CI age key and recipient
          sed -i "s/recipient = \".*\"/recipient = \"$CI_PUBKEY\"/" "$HOME/.config/chezmoi/chezmoi.toml"
          # Verify sops can use the key (sanity check)
          export SOPS_AGE_KEY_FILE="$HOME/.config/chezmoi/key.txt"
          echo "test: value" > test_sops.yaml
          sops --encrypt --age "$CI_PUBKEY" test_sops.yaml > test_sops.enc.yaml
          sops --decrypt test_sops.enc.yaml | grep -q "test: value"
          test "$(chezmoi source-path)" = "$HOME/.local/share/chezmoi"

      - name: Test secret add hook
        shell: bash
        run: |
          cd "$HOME"
          bash "$GITHUB_WORKSPACE/scripts/test_check-secrets.sh"

      - name: Test removed-file update hook
        shell: bash
        run: |
          cd "$HOME"
          bash "$GITHUB_WORKSPACE/scripts/test_check-removed-files.sh"

      - name: Test bootstrap hook
        shell: bash
        run: |
          cd "$HOME"
          bash "$GITHUB_WORKSPACE/scripts/test_bootstrap.sh"

      - name: Test secret rendering
        shell: bash
        run: |
          cd "$HOME"
          bash "$GITHUB_WORKSPACE/scripts/test_apply-secrets.sh"

      - name: Test reusable secret scanner
        shell: bash
        run: |
          cd "$HOME"
          bash "$GITHUB_WORKSPACE/scripts/test_scan-secrets.sh"

      - name: Render the Herdr wiring
        shell: bash
        run: |
          # These three assertions are the cheap half of the Herdr integration: they
          # prove the fragment is included by both rc files and that the templated
          # config resolved homeDir instead of shipping a literal template marker.
          set -euo pipefail
          rc="$(chezmoi cat ~/.zshrc)"
          printf '%s\n' "$rc" | grep -q 'herdr/scripts/herdr-sync-hook.sh'
          printf '%s\n' "$rc" | grep -q 'HERDR_HIST_SEED='
          printf '%s\n' "$(chezmoi cat ~/.bashrc)" | grep -q 'herdr/scripts/herdr-sync-hook.sh'
          cfg="$(chezmoi cat ~/.config/herdr/config.toml)"
          printf '%s\n' "$cfg" | grep -q "{{ .chezmoi" && { echo "unrendered template left in config.toml"; exit 1; } || true
          printf '%s\n' "$cfg" | grep -q "$HOME/.config/herdr/scripts/herdr-sync.sh toggle"
          printf '%s\n' "$cfg" | grep -q "$HOME/.config/herdr/scripts/herdr-sync.sh compose"

      - name: Run ShellCheck
        shell: bash
        run: |
          shellcheck "$GITHUB_WORKSPACE"/scripts/*.sh

  lint:
    name: Shell lint (sh, bash 3.2, zsh, dash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh dash shellcheck

      - name: ShellCheck the Herdr scripts
        shell: bash
        run: |
          # Warning level, not info: the remaining info findings are shell-dialect
          # opinions (local in a file that must parse as sh, function names with "-",
          # which both bash and zsh accept) that the runtime checks below settle better
          # than a linter can.
          shellcheck -S warning \
            dot_config/herdr/scripts/executable_herdr-sync.sh \
            dot_config/herdr/scripts/herdr-sync-hook.sh \
            dot_config/herdr/scripts/executable_herdr-status.sh \
            dot_config/herdr/scripts/tests/executable_*.sh

      - name: Every script must parse under every shell it may meet
        shell: bash
        run: |
          set -euo pipefail
          # Grouped by dialect on purpose. Insisting that every file parses as POSIX sh
          # would be simply false: the hook's zsh branch writes $preexec_functions+=(...),
          # which has no sh spelling. So each file is parsed by the shells that really read
          # it, and a construct only one of them accepts fails here instead of at somebody's
          # shell startup:
          #   POSIX — herdr-status.sh is #!/bin/sh; Herdr runs it with whatever /bin/sh is
          #   hook  — sourced from .zshrc and .bashrc, so bash and zsh (plus 3.2 below)
          #   bash  — herdr-sync.sh and the suite, which are #!/usr/bin/env bash
          POSIX_FILES=(dot_config/herdr/scripts/executable_herdr-status.sh)
          HOOK_FILES=(dot_config/herdr/scripts/herdr-sync-hook.sh)
          BASH_FILES=(dot_config/herdr/scripts/executable_herdr-sync.sh
                      dot_config/herdr/scripts/tests/executable_run-tests.sh)
          fail=0
          parse() {
            local sh=$1 f
            shift
            for f in "$@"; do
              if ! "$sh" -n "$f" 2>/dev/null; then
                echo "::error file=$f,title=$sh cannot parse this file::run '$sh -n $f'"
                fail=1
              fi
            done
          }
          for sh in sh dash bash zsh; do parse "$sh" "${POSIX_FILES[@]}"; done
          for sh in bash zsh; do parse "$sh" "${HOOK_FILES[@]}"; done
          parse bash "${BASH_FILES[@]}"
          exit "$fail"

      - name: Parse under bash 3.2 (still what macOS ships)
        shell: bash
        run: |
          set -euo pipefail
          # The runner's brew bash is 5.x; the Mac this config lives on runs /bin/bash 3.2
          # for anything that does not resolve to brew bash, and so does an older Linux box.
          # The macOS job parses with a real 3.2 natively; this reproduces it on the Linux
          # side so a change cannot pass there and break at home.
          docker run --rm -v "$PWD:/w:ro" -w /w bash:3.2 bash -c '
            status=0
            for f in dot_config/herdr/scripts/executable_herdr-sync.sh \
                     dot_config/herdr/scripts/herdr-sync-hook.sh \
                     dot_config/herdr/scripts/executable_herdr-status.sh \
                     dot_config/herdr/scripts/tests/executable_*.sh; do
              bash -n "$f" || { echo "bash 3.2 cannot parse $f"; status=1; }
            done
            exit "$status"'
          echo 'bash 3.2 parses every Herdr script'

  herdr-suite:
    name: Herdr scripts (${{ matrix.shellset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shellset: [all-shells, bash-only]
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          # expect is not needed on Linux (util-linux "script -e" drives the PTY tests)
          # but installing it keeps the failure surface identical to the macOS runner.
          sudo apt-get install -y zsh jq expect

      - name: Remove zsh to reproduce a bash-only host
        if: matrix.shellset == 'bash-only'
        shell: bash
        run: |
          sudo rm -f "$(command -v zsh)"
          # An assertion, not a formality: if zsh were somehow still reachable, this job
          # would silently run the same tests as the other matrix leg and prove nothing.
          ! command -v zsh

      - name: Materialize the scripts the way chezmoi applies them
        shell: bash
        run: |
          set -euo pipefail
          # In the source tree the files carry chezmoi prefixes (executable_herdr-sync.sh,
          # dot_config/...), but the suite finds its siblings by plain name. Copying with
          # the prefixes stripped reproduces the applied layout without needing sops or an
          # age key, and it is recursive on purpose: a file added later cannot be skipped
          # by accident, which a hand-written list of paths would allow.
          dest="$RUNNER_TEMP/applied"
          mkdir -p "$dest"
          ( cd dot_config/herdr
            find . -type f ! -name '*.tmpl' | while IFS= read -r rel; do
              # Strip the prefix from the BASENAME only: ${var#pat} anchors at the start
              # of the string, so "scripts/executable_foo.sh" would keep it forever.
              dir=$(dirname "$rel"); base=$(basename "$rel")
              base=${base#dot_}; base=${base#executable_}; base=${base#create_}; base=${base#empty_}
              case $dir in
                .) out=$base ;;
                *) out=${dir#./}/$base ;;
              esac
              mkdir -p "$dest/.config/herdr/$(dirname "$out")"
              cp "$rel" "$dest/.config/herdr/$out"
              case "$rel" in *executable_*) chmod +x "$dest/.config/herdr/$out" ;; esac
            done )
          echo "SUITE=$dest/.config/herdr/scripts/tests/run-tests.sh" >> "$GITHUB_ENV"
          find "$dest/.config/herdr" -type f | sed "s|$dest|.config|" | sort

      - name: Run the suite
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/suite.log"
          bash "$SUITE" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          summary="$(grep '^summary ' "$log" | tail -1)"
          echo "suite: $summary"
          echo "$summary" | grep -q 'failed=0' || { echo "::error::herdr suite reported failures"; exit 1; }
          [ "$status" = 0 ] || { echo "::error::herdr suite exited $status"; exit "$status"; }
          if [ '${{ matrix.shellset }}' = all-shells ]; then
            # Nothing may be skipped here: a skip would mean the PTY harness silently
            # declined and interactive preexec/DEBUG coverage never ran.
            echo "$summary" | grep -q 'skipped=0' || { echo "::error::skips on a full shell set"; exit 1; }
          else
            # And the opposite contract: this leg exists only if the zsh cases really
            # skipped instead of failing.
            skipped=${summary##*skipped=}
            [ "$skipped" -gt 0 ] || { echo "::error::nothing skipped, so zsh was still present"; exit 1; }
          fi
